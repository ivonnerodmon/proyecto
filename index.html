<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sustentación Maestría - Ivonne Maritza Rodríguez</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* === RESET Y VARIABLES === */
        :root {
            --primary: #e0c097;
            --dark: #0a0c10;
            --text: #ffffff;
            --transition-speed: 1.8s;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; 
            background-color: #000; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Contenedor principal con relación de aspecto 16:9 horizontal */
        #stage-16-9 {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 ratio */
            max-height: 100vh;
            max-width: 177.78vh; /* 16:9 ratio */
            background-color: var(--dark);
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }
        
        /* === PANTALLA DE INICIO === */
        #intro-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #161a25 0%, #050608 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1), opacity 1.5s ease;
        }
        #intro-screen.hidden { transform: translateY(-100%); opacity: 0; pointer-events: none; }

        #intro-text {
            text-align: center; z-index: 2; opacity: 0; transform: translateY(30px);
            animation: slideUpFade 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.5s; max-width: 85%;
        }
        #intro-text h2 { font-size: clamp(0.8rem, 1.2vw, 1.4rem); font-weight: 500; margin-bottom: 12px; color: #8e9bb0; letter-spacing: 3px; text-transform: uppercase; }
        #intro-text h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.6rem, 3.2vw, 3.6rem); margin-bottom: 35px; font-weight: 600; letter-spacing: 1px; line-height: 1.2; }
        #intro-text h3 { font-size: clamp(1.1rem, 1.8vw, 2.2rem); font-family: 'Playfair Display', serif; font-style: italic; color: var(--primary); font-weight: 400; }

        #btn-iniciar {
            margin-top: 50px; z-index: 3; background: transparent; color: var(--text);
            border: 1px solid rgba(224, 192, 151, 0.5); padding: 18px 50px; font-size: clamp(0.9rem, 1.2vw, 1.4rem); 
            letter-spacing: 4px; cursor: pointer; border-radius: 50px; opacity: 0; 
            animation: fadeIn 2s forwards 1.2s; transition: all 0.4s ease;
            position: relative; overflow: hidden;
        }
        #btn-iniciar::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        #btn-iniciar:hover::before { left: 100%; }
        #btn-iniciar:hover { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: 0 0 30px rgba(224, 192, 151, 0.3); }

        /* === SISTEMA DE DIAPOSITIVAS === */
        #slides-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; visibility: hidden; z-index: 1; pointer-events: none; }
        .slide.active { visibility: visible; z-index: 3; pointer-events: auto; }
        .slide.outgoing { visibility: visible; z-index: 2; }

        .slide-transition {
            width: 100%; height: 100%; position: absolute; overflow: hidden;
            clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
            transition: clip-path var(--transition-speed) cubic-bezier(0.77, 0, 0.175, 1);
        }
        .slide.active .slide-transition { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
        .slide.active.reverse .slide-transition { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); animation: wipeReverse var(--transition-speed) cubic-bezier(0.77, 0, 0.175, 1) forwards; }
        
        @keyframes wipeReverse { 0% { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); } 100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); } }

        .slide-bg { width: 100%; height: 100%; background-size: cover; background-position: center; transform: scale(1.1); transition: transform 25s linear; filter: brightness(1); }
        .slide.active .slide-bg { transform: scale(1); }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 10, 0.72); backdrop-filter: blur(8px);
            opacity: 0; transition: opacity 1.5s ease;
        }
        .slide.show-content .overlay { opacity: 1; }

        /* === INTERFAZ NARRADOR Y TEXTO === */
        .narrator-container {
            position: absolute; top: 46%; left: 8%; right: 8%;
            display: flex; align-items: center; gap: clamp(20px, 3vw, 40px);
            opacity: 0; transform: translateY(-20%);
            transition: all 1.2s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 10;
        }
        .slide.show-content .narrator-container { opacity: 1; transform: translateY(-50%); }

        /* Ajuste de márgenes cuando hay video a la izquierda o a la derecha */
        .slide.has-video-left .narrator-container { left: 32%; right: 6%; }
        .slide.has-video-right .narrator-container { left: 6%; right: 32%; }

        .avatar { width: clamp(70px, 9vw, 130px); height: clamp(70px, 9vw, 130px); flex-shrink: 0; filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.5)); }
        .avatar svg { width: 100%; height: 100%; }
        
        .mouth { transition: ry 0.1s ease; transform-origin: center; }
        .speaking .mouth { animation: talk 0.3s infinite alternate; }
        @keyframes talk { 0% { ry: 1px; } 100% { ry: 8px; } }

        .slide-text-wrapper { width: 100%; }
        .slide-section-title {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.85rem, 1.3vw, 1.3rem);
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .slide-quote {
            font-family: 'Playfair Display', serif; 
            font-size: clamp(1.2rem, 2.2vw, 2.7rem); 
            font-style: italic; line-height: 1.4; text-shadow: 0px 5px 15px rgba(0,0,0,0.8); color: #ffffff; width: 100%;
        }
        .cursor { display: inline-block; width: 3px; height: 1em; background-color: var(--primary); vertical-align: text-bottom; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* ==========================================================================
           ZONA DE VIDEOS (POSICIÓN Y TAMAÑO MODIFICABLES AQUÍ)
           Puedes cambiar 'top', 'left', 'right' y 'width' para mover los videos
           ========================================================================== */
        .video-box {
            position: absolute;
            top: 46%; /* Posición vertical (centrado respecto al área de contenido) */
            transform: translateY(-50%);
            width: 22%; /* Tamaño pequeño para acompañar la presentación */
            aspect-ratio: 9 / 16; /* Se adapta bien a videos verticales u horizontales con object-fit */
            max-height: 60%;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid var(--primary);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.85);
            z-index: 15;
            opacity: 0;
            transition: opacity 1.2s ease, transform 1.2s ease;
            background: #000;
        }

        .slide.show-content .video-box {
            opacity: 1;
        }

        /* Posición cuando el video va a la IZQUIERDA */
        .video-box.pos-left {
            left: 5%; /* Modificar este valor para acercar o alejar del borde izquierdo */
        }

        /* Posición cuando el video va a la DERECHA */
        .video-box.pos-right {
            right: 5%; /* Modificar este valor para acercar o alejar del borde derecho */
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* =================== FIN DE ZONA DE VIDEOS EN CSS =================== */

        /* === UI CONTROLES (Botones ATRÁS y ADELANTE, Audio y Progreso) === */
        #progress-bar { position: absolute; top: 0; left: 0; height: 5px; background: var(--primary); transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 20; width: 0%; box-shadow: 0 0 10px var(--primary); }

        #controls-bar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            gap: 25px;
            z-index: 50;
        }

        .nav-btn {
            background: rgba(10, 12, 16, 0.75);
            border: 1px solid rgba(224, 192, 151, 0.6);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.8rem, 1vw, 1.1rem);
            font-weight: 500;
            letter-spacing: 2px;
            padding: 12px 28px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px rgba(224, 192, 151, 0.4);
        }
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        #slide-counter {
            font-size: clamp(0.8rem, 1vw, 1rem);
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
            min-width: 60px;
            text-align: center;
        }

        #btn-audio {
            position: absolute; top: 20px; left: 20px; z-index: 50;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
            color: white; font-size: 1.2rem; width: 45px; height: 45px; border-radius: 50%;
            cursor: pointer; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="stage-16-9">
        <!-- Audio de fondo de la presentación -->
        <audio id="audio-fondo" loop preload="auto"><source src="fondo.mp3" type="audio/mpeg"></audio>

        <!-- Pantalla Inicial -->
        <div id="intro-screen">
            <div id="intro-text">
                <h2>Universidad Libre de Colombia</h2>
                <h2>Facultad Ciencias de la Educación - Maestría en Educación</h2>
                <h1>Estrategias psicopedagógicas para fortalecer la inclusión y las habilidades para la vida</h1>
                <h3>Ivonne Maritza Rodríguez Monroy</h3>
            </div>
            <button id="btn-iniciar">INICIAR PRESENTACIÓN</button>
        </div>

        <!-- Botón de sonido -->
        <button id="btn-audio" title="Activar/Desactivar Sonido de Fondo">🔊</button>

        <!-- Contenedor de diapositivas -->
        <div id="slides-container"></div>
        
        <!-- Barra de progreso superior -->
        <div id="progress-bar"></div>

        <!-- Controles de navegación para la presentadora -->
        <div id="controls-bar">
            <button id="btn-prev" class="nav-btn">❮ ATRÁS</button>
            <span id="slide-counter">1 / 31</span>
            <button id="btn-next" class="nav-btn">ADELANTE ❯</button>
        </div>
    </div>

    <!-- Plantilla del Avatar -->
    <template id="avatar-template">
        <div class="avatar" id="avatar-anim">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="48" fill="#1a1f2b" stroke="#e0c097" stroke-width="2"/>
                <path d="M 20 90 Q 50 60 80 90 Z" fill="#2c3545"/>
                <rect x="42" y="60" width="16" height="15" fill="#e8c3a5"/>
                <circle cx="50" cy="45" r="22" fill="#f2d1b3"/>
                <path d="M 28 45 Q 20 20 50 15 Q 80 20 72 45 Q 85 75 50 85 Q 15 75 28 45 Z" fill="#ffffff" opacity="0.9"/>
                <circle cx="50" cy="48" r="16" fill="#f2d1b3"/>
                <circle cx="41" cy="42" r="6" fill="none" stroke="#5a687d" stroke-width="2"/>
                <circle cx="59" cy="42" r="6" fill="none" stroke="#5a687d" stroke-width="2"/>
                <line x1="47" y1="42" x2="53" y2="42" stroke="#5a687d" stroke-width="2"/>
                <circle cx="41" cy="42" r="2" fill="#1a1f2b"/>
                <circle cx="59" cy="42" r="2" fill="#1a1f2b"/>
                <ellipse cx="50" cy="58" rx="5" ry="1" fill="#1a1f2b" class="mouth"/>
            </svg>
        </div>
    </template>

    <script>
        // ==========================================
        const volumenFondo = 6; // Volumen de fondo.mp3 (de 0 a 10)
        // ==========================================

        /* ==========================================================================
           ZONA DE CONFIGURACIÓN DE VIDEOS
           Los 6 archivos de video subidos se alternarán automáticamente a izquierda 
           y derecha en las diapositivas.
           ========================================================================== */
        const listaVideos = [
            'video1.mp4',
            'video2.mp4',
            'video3.mp4',
            'video4.mp4',
            'video5.mp4',
            'video6.mp4'
        ];
        /* =================== FIN DE ZONA DE VIDEOS EN JS =================== */

        // Lista completa de diapositivas:
        // - Objetivos con fondo1.png
        // - Desarrollo con session1a.jpg a session3h.jpg (habiendo quitado el texto de "sustentado metodológicamente..." y ajustado los textos con las imágenes)
        // - Conclusiones y cierre con fondo2.png
        const slidesData = [
            // --- OBJETIVOS (con fondo1.png) ---
            { 
                img: 'fondo1.png', 
                titulo: 'Objetivo General',
                txt: 'Analizar el alcance de las estrategias pedagógicas que se desarrollan en este contexto inclusivo, buscando comprender de qué manera estas prácticas inciden en el fortalecimiento de las habilidades para la vida cotidiana y en la construcción de autonomía de quienes hacen parte del programa.' 
            },
            { 
                img: 'fondo1.png', 
                titulo: 'Objetivo Específico 1',
                txt: 'Reconocer las características de las dinámicas inclusivas que se configuran en el ambiente pedagógico de la fundación, explorando su vinculación con los modos en que los beneficiarios participan y construyen sus aprendizajes.' 
            },
            { 
                img: 'fondo1.png', 
                titulo: 'Objetivo Específico 2',
                txt: 'Describir las actividades de tipo recreativo y las estrategias de filtro asertivas implementadas, resaltando su papel en el fomento de la inclusión y en el fortalecimiento de habilidades básicas.' 
            },
            { 
                img: 'fondo1.png', 
                titulo: 'Objetivo Específico 3',
                txt: 'Explorar las valoraciones que tanto los participantes como el equipo pedagógico tienen respecto a estos resultados, particularmente en el avance de su autonomía personal y habilidades sociales.' 
            },

            // --- DESARROLLO DE LAS SESIONES (con texto ajustado sin "Sustentado metodológicamente...") ---
            { img: 'session1a.jpg', txt: 'La inclusión real no se mide por la adaptación pasiva, sino por la garantía de espacios donde cada persona pueda ser, sentir y decidir con plena dignidad.' },
            { img: 'session1b.jpg', txt: 'En la Asociación para el Desarrollo de Habilidades Diversas, nos encontramos con nueve historias de vida adulta que desafían a diario las etiquetas diagnósticas.' },
            { img: 'session1c.jpg', txt: 'Frente a la tendencia de infantilizar al adulto con discapacidad, validamos el valor intrínseco de su voz y su autonomía.' },
            { img: 'session1d.jpg', txt: 'Convertimos el aula en un filtro afectivo positivo: un entorno seguro que desactiva la alerta límbica y habilita los procesos superiores.' },
            { img: 'session1e.jpg', txt: 'Estructuramos un protocolo en cinco tiempos: acogida, elección, creación cooperativa, metacognición dialógica y vinculación empática.' },
            { img: 'session1f.jpg', txt: 'Validar las emociones incondicionalmente permitió descubrir que el enojo y la tristeza son expresiones legítimas que merecen escucha.' },
            { img: 'session1g.jpg', txt: 'La libertad de escoger sin buscar la aprobación docente fue el primer acto de soberanía personal frente a años de directrices.' },
            { img: 'session1h.jpg', txt: 'Cuando las palabras orales encontraron límites, emergieron miradas, señas y gestos cargados de una empatía profunda.' },
            { img: 'session1i.jpg', txt: 'A pesar de las dificultades motrices, el deseo de plasmar la propia identidad superó cualquier barrera física.' },
            { img: 'session2a.jpg', txt: 'El salón dejó de ser un conjunto de individualidades para convertirse en un espejo de admiración e imitación mutua.' },
            { img: 'session2b.jpg', txt: 'Al eliminar los estándares estéticos rígidos, la ansiedad se disolvió en el placer compartido de crear un árbol común.' },
            { img: 'session2c.jpg', txt: 'Sustituir la tijera por el rasgado libre demostró que la barrera nunca estuvo en la persona, sino en el material impuesto.' },
            { img: 'session2d.jpg', txt: 'Manos que sostuvieron el papel para que otro pegara su retazo: la cooperación brotó sin instrucción adulta.' },
            { img: 'session2e.jpg', txt: 'Repartir tareas enseñó que la organización horizontal genera orden, sentido de pertenencia y valoración comunitaria.' },
            { img: 'session2f.jpg', txt: 'Aprender a esperar el turno frente a un lienzo compartido demandó memoria y autorregulación colectiva.' },
            { img: 'session2g.jpg', txt: 'El tacto y los aromas actuaron como moduladores directos, transformando la inquietud en serenidad somática.' },
            { img: 'session3a.jpg', txt: 'Participantes que mostraban apatía encontraron en la textura táctil un puente de interés y reconexión activa.' },
            { img: 'session3b.jpg', txt: 'Un recurso de calma construido con las propias manos adquiere un valor que ningún objeto comercial puede igualar.' },
            { img: 'session3c.jpg', txt: 'Acompañar los temblores con apoyo guiado garantizó que el participante fuera el autor de su propia herramienta.' },
            { img: 'session3d.jpg', txt: 'La calma vivenciada abrió el camino para entrenar el uso de estos recursos en el hogar y la vida independiente.' },
            { img: 'session3e.jpg', txt: 'Uno de los mayores logros fue ver a las cuidadoras soltar la mano que guiaba para convertirse en soporte logístico.' },
            // Aquí se eliminó el texto de "Sustentado metodológicamente..." y se ajustaron las imágenes restantes:
            { img: 'session3f.jpg', txt: 'Confirmamos que la discapacidad es una invitación pedagógica a derribar las barreras del entorno.' },
            { img: 'session3g.jpg', txt: 'La mediación psicopedagógica se consolida como una práctica emancipadora de autodeterminación y dignidad.' },
            { img: 'session3h.jpg', txt: 'Educar desde el afecto y la cooperación no es una utopía: es el acto de justicia social que transforma el cuidado en libertad.' },

            // --- CONCLUSIONES Y DEMÁS CONTENIDO (con session3i.jpg y fondo2.png) ---
            { 
                img: 'session3i.jpg', 
                titulo: 'Conclusiones (1 / 4)',
                txt: '1) El filtro afectivo disminuye el aislamiento y fomenta la participación.' 
            },
            { 
                img: 'fondo2.png', 
                titulo: 'Conclusiones (2 / 4)',
                txt: '2) El principal obstáculo no es la diversidad funcional, sino la falta de estrategias psicopedagógicas.' 
            },
            { 
                img: 'fondo2.png', 
                titulo: 'Conclusiones (3 / 4)',
                txt: '3) Urgencia de pasar del modelo asistencial al de capacidades y autonomía.' 
            },
            { 
                img: 'fondo2.png', 
                titulo: 'Conclusión Final',
                txt: '"Las fundaciones con enfoques diferenciales deben convertirse en laboratorios de investigación pedagógica y social, donde pasemos del cuidado infantilizado al respeto absoluto por la dignidad y la diferencia."' 
            }
        ];

        let currentSlide = 0;
        let slideTimer;
        let typeWriterTimeout;
        const container = document.getElementById('slides-container');
        const progressBar = document.getElementById('progress-bar');
        const audioFondo = document.getElementById('audio-fondo');
        const avatarTemplate = document.getElementById('avatar-template').innerHTML;

        const controlsBar = document.getElementById('controls-bar');
        const btnNext = document.getElementById('btn-next');
        const btnPrev = document.getElementById('btn-prev');
        const btnAudio = document.getElementById('btn-audio');
        const slideCounter = document.getElementById('slide-counter');

        // Construcción dinámica de diapositivas y asignación de videos alternados (izquierda / derecha)
        slidesData.forEach((data, index) => {
            const slideDiv = document.createElement('div');
            
            /* ==========================================================================
               ZONA DE ASIGNACIÓN DE VIDEOS EN CADA DIAPOSITIVA
               Alterna posición: índice par -> izquierda ('pos-left'), impar -> derecha ('pos-right')
               Cambia entre video1.mp4 y video6.mp4 secuencialmente.
               ========================================================================== */
            const videoFile = listaVideos[index % listaVideos.length];
            const isLeft = (index % 2 === 0);
            const videoPosClass = isLeft ? 'pos-left' : 'pos-right';
            const slideLayoutClass = isLeft ? 'has-video-left' : 'has-video-right';

            slideDiv.className = `slide ${slideLayoutClass}`;
            
            const tituloHTML = data.titulo ? `<div class="slide-section-title">${data.titulo}</div>` : '';

            slideDiv.innerHTML = `
                <div class="slide-transition">
                    <div class="slide-bg" style="background-image: url('${data.img}');"></div>
                    <div class="overlay"></div>
                </div>

                <!-- ZONA DE VIDEO EN HTML: Reproducción en bucle (loop) y sin sonido (muted) -->
                <div class="video-box ${videoPosClass}">
                    <video src="${videoFile}" loop muted playsinline preload="metadata"></video>
                </div>

                <div class="narrator-container">
                    ${avatarTemplate}
                    <div class="slide-text-wrapper">
                        ${tituloHTML}
                        <div class="slide-quote">
                            <span class="text-container" id="text-${index}"></span><span class="cursor"></span>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(slideDiv);
        });

        const slides = document.querySelectorAll('.slide');

        function typeWriter(text, elementId, avatarElement) {
            const element = document.getElementById(elementId);
            element.innerHTML = '';
            let i = 0;
            avatarElement.classList.add('speaking'); 

            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    typeWriterTimeout = setTimeout(type, 32); 
                } else {
                    avatarElement.classList.remove('speaking'); 
                }
            }
            type();
        }

        // --- INICIO EN PANTALLA COMPLETA Y AUDIO DE FONDO ---
        document.getElementById('btn-iniciar').addEventListener('click', () => {
            const elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); } 
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); } 
            else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }

            audioFondo.volume = volumenFondo / 10;
            
            let playPromise = audioFondo.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Audio bloqueado por el navegador:", error);
                    btnAudio.innerHTML = "🔇";
                });
            }

            document.getElementById('intro-screen').classList.add('hidden');
            
            controlsBar.style.display = 'flex';
            btnAudio.style.display = 'flex';

            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                container.style.display = 'block';
                showSlide(0, 'next');
            }, 1200);
        });

        // Botón para silenciar/activar fondo.mp3
        btnAudio.addEventListener('click', () => {
            if (audioFondo.paused || audioFondo.muted) {
                audioFondo.muted = false;
                audioFondo.play();
                btnAudio.innerHTML = "🔊";
            } else {
                audioFondo.muted = true;
                btnAudio.innerHTML = "🔇";
            }
        });

        function showSlide(index, direction) {
            clearTimeout(slideTimer);
            clearTimeout(typeWriterTimeout);
            
            // Pausar todos los videos de las otras diapositivas y limpiar estado
            slides.forEach((s, i) => {
                s.classList.remove('active', 'outgoing', 'reverse', 'show-content');
                const txt = document.getElementById(`text-${i}`);
                if (txt) txt.innerHTML = ''; 
                const avatar = s.querySelector('.avatar');
                if (avatar) avatar.classList.remove('speaking');

                const vid = s.querySelector('video');
                if (vid) {
                    vid.pause();
                    vid.currentTime = 0;
                }
            });

            if (direction === 'prev') slides[index].classList.add('reverse');
            slides[index].classList.add('active');
            
            // Actualizar barra de progreso y contador de botones
            progressBar.style.width = ((index + 1) / slides.length) * 100 + '%';
            slideCounter.textContent = `${index + 1} / ${slides.length}`;
            btnPrev.disabled = (index === 0);
            btnNext.disabled = (index === slides.length - 1);

            // Reproducir en bucle y sin sonido el video de la diapositiva actual
            const activeVideo = slides[index].querySelector('video');
            if (activeVideo) {
                activeVideo.muted = true;
                activeVideo.play().catch(e => {});
            }

            // Mostrar el texto y animar al narrador
            slideTimer = setTimeout(() => {
                slides[index].classList.add('show-content');
                const avatarAnim = slides[index].querySelector('.avatar');
                typeWriter(slidesData[index].txt, `text-${index}`, avatarAnim);
            }, 2200); 
        }

        // --- CONTROLES DE NAVEGACIÓN (ATRÁS Y ADELANTE) ---
        function irSiguiente() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                showSlide(currentSlide, 'next');
            }
        }
        function irAnterior() {
            if (currentSlide > 0) {
                currentSlide--;
                showSlide(currentSlide, 'prev');
            }
        }

        btnNext.addEventListener('click', irSiguiente);
        btnPrev.addEventListener('click', irAnterior);

        document.addEventListener('keydown', (e) => {
            if (container.style.display === 'block') {
                if (e.key === 'ArrowRight' || e.key === ' ') irSiguiente();
                else if (e.key === 'ArrowLeft') irAnterior();
            }
        });

        // --- SOPORTE SWIPE PARA PANTALLAS TÁCTILES ---
        let touchstartX = 0;
        let touchendX = 0;
        document.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            if (container.style.display === 'block') {
                if (touchendX < touchstartX - 50) irSiguiente();
                if (touchendX > touchstartX + 50) irAnterior();
            }
        });
    </script>
</body>
</html>
